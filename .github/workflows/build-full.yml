name: build full release
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      hb_tag:
        description: 'Version Tag'
        default: '1.11.2'
        required: true
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os-version: ["trixie", "bookworm", "bullseye", "noble", "resolute", "jammy", "focal"]
    container:
      image: "ghcr.io/${{ github.repository_owner }}/handbrake-custom-build:${{ matrix.os-version }}"
      options: --privileged --device /dev/fuse
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set HandBrake tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.hb_tag }}" ]; then
            tag="${{ github.event.inputs.hb_tag }}"
          else
            tag="${GITHUB_REF#refs/*/}"
          fi
          tag="${tag#v}"
          tag="${tag#V}"
          tag="${tag#Release/}"
          tag="${tag#release/}"
          echo "hb_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "HB_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Normalized HandBrake tag: ${tag}"
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: |
            cache
          key: "${{ matrix.os-version }}-build-cache-${{ steps.vars.outputs.hb_tag }}"
          restore-keys: |
            "${{ matrix.os-version }}-build-cache-"
      - name: Run build script
        run: ./scripts/build.sh
        env:
          DEB_FLAVOR: "${{ matrix.os-version }}"
          HB_TAG: "${{ steps.vars.outputs.hb_tag }}"
      - name: Cache build
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            cache
          key: "${{ matrix.os-version }}-build-cache-${{ steps.vars.outputs.hb_tag }}"
      - name: Upload deb files
        uses: actions/upload-artifact@v7
        with:
          name: "packages-${{ steps.vars.outputs.hb_tag }}-${{ matrix.os-version }}"
          path: ./*.deb

  merge-artefacts:
    name: Merge all deb files to single artifact
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: debian-packages
        uses: actions/upload-artifact/merge@v7

  add_release:
    name: Add package to release
    needs: merge-artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: merged-artifacts
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./*.deb

  add_repo:
    name: Add packages to public debian repository
    runs-on: ubuntu-latest
    needs: merge-artefacts
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: "merged-artifacts"
      - name: Add releases to repo
        uses: smeinecke/apt-repo-action@v2.2.0
        with:
          github_token: ${{ github.token }}
          repo_supported_arch: |
            amd64
          repo_supported_version: |
            trixie
            bookworm
            bullseye
            focal
            jammy
            noble
            resolute
          file: |
            *.deb
          version_by_filename: true
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          key_passphrase: ""
